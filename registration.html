
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Register for the College Coding Club">
    <title>Registration | College Coding Club</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>

<header>
    <h1>💻 College Coding Club</h1>
    <p>Learn • Code • Innovate • Connect</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="registration.html">Registration</a>
    <a href="contact.html">Contact</a>
</nav>

<main>
    <section class="content">
        <h2>Student Registration Form</h2>

        <p>Fill out the form below to become a member of our club.</p>

        <form class="registration-form"
              action="#"
              method="post"
              onsubmit="alert('Thank you! Your registration form has been submitted.'); return false;">

            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name"
                   placeholder="Enter your full name" required>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email" required>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone"
                   placeholder="Enter your phone number" required>

            <label for="roll">College Roll Number:</label>
            <input type="text" id="roll" name="roll"
                   placeholder="Enter your roll number" required>

            <label for="course">Select Your Course:</label>
            <select id="course" name="course" required>
                <option value="">-- Select Course --</option>
                <option>BCA</option>
                <option>B.Tech</option>
                <option>B.Sc Computer Science</option>
                <option>MCA</option>
                <option>Other</option>
            </select>

            <label for="year">Year of Study:</label>
            <select id="year" name="year" required>
                <option value="">-- Select Year --</option>
                <option>First Year</option>
                <option>Second Year</option>
                <option>Third Year</option>
                <option>Fourth Year</option>
            </select>

            <label for="interest">Area of Interest:</label>
            <select id="interest" name="interest" required>
                <option value="">-- Select Interest --</option>
                <option>Web Development</option>
                <option>Python Programming</option>
                <option>Artificial Intelligence</option>
                <option>Cyber Security</option>
                <option>App Development</option>
            </select>

            <label for="message">Why do you want to join?</label>
            <textarea id="message" name="message"
                      rows="4"
                      placeholder="Write your reason here..."></textarea>

            <button type="submit">Submit Registration</button>
            <button type="reset" class="reset-btn">Reset Form</button>

        </form>
    </section>
</main>

<footer>
    <p>&copy; 2026 College Coding Club. All Rights Reserved.</p>
</footer>

</body>
</html>
